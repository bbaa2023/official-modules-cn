name: Production Work Orders Verification

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - feat/production-work-orders-v0.1

jobs:
  verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install markitdown
        run: pipx install 'markitdown[all]'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build:packages

      - name: Generate
        run: yarn generate

      - name: Rebuild packages
        run: yarn build:packages

      - name: Check dependency versions
        run: yarn check:dep-versions

      - name: Check i18n sync
        run: yarn i18n:check-sync:packages

      - name: Check i18n usage
        continue-on-error: true
        run: yarn i18n:check-usage:packages

      - name: Typecheck production work orders
        run: yarn workspace @open-mercato/production-work-orders typecheck

      - name: Test production work orders
        run: yarn workspace @open-mercato/production-work-orders test

# CI validates the production-work-orders package directly. Repository-wide typecheck/test
# currently include unrelated upstream/other-package failures, so they are intentionally
# outside the required gate for this demo module.
# Trigger verification after automated lockfile synchronization commits.
