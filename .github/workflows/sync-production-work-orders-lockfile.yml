name: Sync Production Work Orders Lockfile

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync yarn.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/production-work-orders-v0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies and regenerate lockfile
        run: yarn install

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "fix(production-work-orders): sync yarn lockfile"
          git push origin HEAD:feat/production-work-orders-v0.1
